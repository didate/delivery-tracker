<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-sm sm:max-w-md">
    <div class="p-4 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900">{{ title }}</h2>
    </div>
    <div class="p-4">
      <div class="text-gray-700" [innerHTML]="body"></div>
    </div>
    <div class="p-4 border-t border-gray-200 flex justify-end gap-2">
      <button
        (click)="onCancel()"
        class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors"
      >
        {{ cancelText }}
      </button>
      <button (click)="onConfirm()" [class]="confirmButtonClass">{{ confirmText }}</button>
    </div>
  </div>
</div>
