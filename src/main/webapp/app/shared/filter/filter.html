@if (filterFields().length > 0) {
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    @for (field of filterFields(); track field.name) {
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">{{ field.label }}</label>
        <input
          type="text"
          class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
          [placeholder]="field.placeholder || ''"
          [(ngModel)]="filterValues[field.name]"
          (keyup.enter)="applyFilter(field)"
        />
      </div>
    }
    <div class="flex items-end">
      <button
        type="button"
        class="w-full px-4 py-2 text-sm bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors disabled:opacity-50"
        (click)="clearAllFilters()"
        [disabled]="!filters().hasAnyFilterSet()"
      >
        <fa-icon icon="times" class="mr-1" />
        <span jhiTranslate="entity.filters.clearAll">Clear</span>
      </button>
    </div>
  </div>
}

@if (filters().hasAnyFilterSet()) {
  <div class="mt-3 pt-3 border-t border-gray-200">
    <div class="flex flex-wrap gap-2">
      @for (filterOption of filters().filterOptions; track filterOption.name) {
        @for (value of filterOption.values; track value) {
          <span class="inline-flex items-center gap-1 px-2 py-1 text-xs bg-orange-100 text-orange-800 rounded-full">
            {{ filterOption.name }}: {{ value }}
            <button type="button" class="hover:text-orange-600" (click)="clearFilter(filterOption.name, value)">
              <fa-icon icon="times" />
            </button>
          </span>
        }
      }
    </div>
  </div>
}
