<div class="min-h-[60vh] flex items-center justify-center px-4">
  <div class="max-w-2xl w-full">
    <div class="flex flex-col md:flex-row items-center gap-8">
      <!-- Error Icon -->
      <div class="flex-shrink-0">
        <div class="w-32 h-32 bg-red-100 rounded-full flex items-center justify-center">
          <svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>
      </div>

      <!-- Error Content -->
      <div class="text-center md:text-left">
        <h1 class="text-3xl font-bold text-gray-900 mb-4" jhiTranslate="error.title">Page d'erreur !</h1>

        @if (errorMessage(); as errMessage) {
          <div class="bg-red-50 text-red-800 border border-red-200 rounded-lg p-4 flex items-start gap-3">
            <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
              <path
                fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                clip-rule="evenodd"
              />
            </svg>
            <span class="text-sm font-medium">{{ errMessage }}</span>
          </div>
        }

        <div class="mt-6">
          <a
            routerLink="/"
            class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            <span jhiTranslate="error.goHome">Retour a l'accueil</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
