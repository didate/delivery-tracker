@if (driver) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(driver.id!)">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-200">
      <h4 class="text-lg font-semibold text-gray-900" data-cy="driverDeleteDialogHeading" jhiTranslate="entity.delete.title">
        Confirmation de suppression
      </h4>
    </div>

    <!-- Body -->
    <div class="px-6 py-6">
      <jhi-alert-error />

      <div class="flex items-start gap-4">
        <div class="flex-shrink-0 w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
          <fa-icon icon="exclamation-triangle" class="text-red-600 text-xl" />
        </div>
        <div>
          <p
            class="text-gray-700"
            id="jhi-delete-driver-heading"
            jhiTranslate="deliveryApp.driver.delete.question"
            [translateValues]="{ id: driver.id }"
          >
            Êtes-vous certain de vouloir supprimer le Driver {{ driver.id }} ?
          </p>
          <p class="mt-2 text-sm text-gray-500">Cette action est irréversible.</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end gap-3">
      <button
        type="button"
        class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors"
        data-dismiss="modal"
        (click)="cancel()"
      >
        <fa-icon icon="ban" class="mr-2" />
        <span jhiTranslate="entity.action.cancel">Annuler</span>
      </button>

      <button
        id="jhi-confirm-delete-driver"
        data-cy="entityConfirmDeleteButton"
        type="submit"
        class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
      >
        <fa-icon icon="trash-alt" class="mr-2" />
        <span jhiTranslate="entity.action.delete">Supprimer</span>
      </button>
    </div>
  </form>
}
