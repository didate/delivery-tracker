@if (customer) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(customer.id!)">
    <!-- Modal Backdrop -->
    <div class="fixed inset-0 bg-black bg-opacity-50 z-40"></div>

    <!-- Modal Content -->
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-lg shadow-xl max-w-md w-full overflow-hidden">
        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-gray-200 bg-red-50">
          <h4 class="text-lg font-semibold text-gray-900" data-cy="customerDeleteDialogHeading" jhiTranslate="entity.delete.title">
            Confirmation de suppression
          </h4>
        </div>

        <!-- Modal Body -->
        <div class="px-6 py-6">
          <jhi-alert-error />

          <div class="flex items-start gap-4">
            <div class="flex-shrink-0 w-10 h-10 rounded-full bg-red-100 flex items-center justify-center">
              <fa-icon icon="exclamation-triangle" class="text-red-600" />
            </div>
            <div>
              <p
                id="jhi-delete-customer-heading"
                class="text-sm text-gray-700"
                jhiTranslate="deliveryApp.customer.delete.question"
                [translateValues]="{ id: customer.id }"
              >
                Êtes-vous certain de vouloir supprimer le Customer {{ customer.id }} ?
              </p>
            </div>
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="px-6 py-4 bg-gray-50 flex justify-end gap-3">
          <button
            type="button"
            class="inline-flex items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors"
            data-dismiss="modal"
            (click)="cancel()"
          >
            <fa-icon icon="ban" />
            <span jhiTranslate="entity.action.cancel">Annuler</span>
          </button>

          <button
            id="jhi-confirm-delete-customer"
            data-cy="entityConfirmDeleteButton"
            type="submit"
            class="inline-flex items-center gap-2 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
          >
            <fa-icon icon="times" />
            <span jhiTranslate="entity.action.delete">Supprimer</span>
          </button>
        </div>
      </div>
    </div>
  </form>
}
