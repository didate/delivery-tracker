<div class="min-h-screen bg-gradient-to-br from-orange-400 via-orange-500 to-orange-600 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <!-- Logo/Icon Section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow-lg mb-4">
        <svg class="w-12 h-12 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white" jhiTranslate="login.title">Delivery</h1>
      <p class="text-orange-100 mt-2">Sign in to your account</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      @if (authenticationError()) {
        <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg" data-cy="loginError">
          <div class="flex items-center">
            <svg class="w-5 h-5 text-red-500 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
            <span class="text-red-700 text-sm font-medium" jhiTranslate="login.messages.error.authentication">
              Authentication error! Please check your credentials.
            </span>
          </div>
        </div>
      }

      <form (ngSubmit)="login()" [formGroup]="loginForm">
        <!-- Username Field -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-2" for="username" jhiTranslate="global.form.username.label">
            Username
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
            </div>
            <input
              type="text"
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-colors"
              name="username"
              id="username"
              #username
              placeholder="{{ 'global.form.username.placeholder' | translate }}"
              formControlName="username"
              data-cy="username"
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-2" for="password" jhiTranslate="login.form.password"> Password </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                ></path>
              </svg>
            </div>
            <input
              type="password"
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-colors"
              name="password"
              id="password"
              placeholder="{{ 'login.form.password.placeholder' | translate }}"
              formControlName="password"
              data-cy="password"
            />
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="mb-6">
          <label class="flex items-center cursor-pointer" for="rememberMe">
            <input
              class="w-4 h-4 text-orange-500 border-gray-300 rounded focus:ring-orange-500 accent-orange-500"
              type="checkbox"
              name="rememberMe"
              id="rememberMe"
              formControlName="rememberMe"
            />
            <span class="ml-2 text-sm text-gray-600" jhiTranslate="login.form.rememberme">Remember me</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full bg-orange-500 text-white py-3 px-4 rounded-lg font-semibold hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 transition-all duration-200 shadow-lg"
          data-cy="submit"
          jhiTranslate="login.form.button"
        >
          Sign In
        </button>
      </form>

      <!-- Forgot Password Link -->
      <div class="mt-6 text-center">
        <a
          class="text-sm text-orange-500 hover:text-orange-600 font-medium transition-colors"
          routerLink="/account/reset/request"
          data-cy="forgetYourPasswordSelector"
          jhiTranslate="login.password.forgot"
        >
          Forgot your password?
        </a>
      </div>

      <!-- Contact Admin Note -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-500">Need an account? Contact your administrator.</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center">
      <p class="text-sm text-orange-100">Delivery Management System</p>
    </div>
  </div>
</div>
